name: Publicar actualizacion

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Crear paquete sin bases internas
        shell: bash
        run: |
          test ! -f Buscador_VIN_Instalable/clientes.dat
          test ! -f Buscador_VIN_Instalable/vehiculos.dat
          cat binary-parts/UglyToad.PdfPig.Fonts.dll.* > Buscador_VIN_Instalable/lib/UglyToad.PdfPig.Fonts.dll
          cat binary-parts/UglyToad.PdfPig.dll.* > Buscador_VIN_Instalable/lib/UglyToad.PdfPig.dll
          test "$(git hash-object Buscador_VIN_Instalable/lib/UglyToad.PdfPig.Fonts.dll)" = "2e1b9817fdef5820a9c5e59d09ee8ec0cc2c079d"
          test "$(git hash-object Buscador_VIN_Instalable/lib/UglyToad.PdfPig.dll)" = "3c6a850a2bab06cc534ea7ba168b59b895243254"
          VERSION=$(sed -n 's/.*AppVersion="\([0-9.]*\)".*/\1/p' Buscador_VIN_Instalable/BuscadorVIN.cs | head -n 1)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          zip -r Buscador_Autosur_Actualizacion.zip Buscador_VIN_Instalable

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Buscador Autosur v${{ env.VERSION }}
          make_latest: true
          files: Buscador_Autosur_Actualizacion.zip
          generate_release_notes: true
